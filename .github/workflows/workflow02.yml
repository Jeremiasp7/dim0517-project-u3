name: Workflow 02

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validar-pr:
    name: Build e testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do merge de teste
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolver dependências
        run: mvn -B dependency:resolve

      - name: Compilar o sistema
        run: mvn -B compile

      - name: Executar testes unitários
        run: mvn -B test -DfailIfNoTests=true
